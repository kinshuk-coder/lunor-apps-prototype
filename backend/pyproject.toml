[project]
name = "lunor-apps-api"
version = "0.1.0"
description = "Lunor Apps backend: idea -> plan -> streamed Expo app -> explain -> learn"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "openai>=1.50",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "sse-starlette>=2.1",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.uv]
package = false
