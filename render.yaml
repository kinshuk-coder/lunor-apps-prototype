# Render blueprint for the FastAPI backend. Set GROQ_API_KEY and CORS_ORIGINS in the dashboard.
services:
  - type: web
    name: lunor-apps-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: STRONG_MODEL
        value: codestral-latest
      - key: FAST_MODEL
        value: openai/gpt-oss-20b
